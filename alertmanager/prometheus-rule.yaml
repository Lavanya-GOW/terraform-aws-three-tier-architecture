apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alert-rules
  namespace: monitoring
  labels:
    role: alert-rules
    release: monitoring
spec:
  groups:
  - name: application_alerts
    rules:
      - alert: HighErrorRate
        expr: sum by (job) (rate(http_requests_total{http_status=~"5.."}[5m])) / sum by (job) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "High HTTP 5xx error rate detected on {{ $labels.job }}"
          description: "Error rate is above 5% (current value: {{ $value | humanizePercentage }})"

      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, pod)) > 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "High latency detected on {{ $labels.pod }}"
          description: "95th percentile latency is above 1 second (current value: {{ $value | humanizeDuration }})"

      - alert: FrontendHighCPUUsage
        expr: 100 *sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="three-tier-app",container="frontend"}[5m])) / sum by (pod) (kube_pod_container_resource_limits{namespace="three-tier-app",container="frontend",resource="cpu",unit="core"}) > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected on pod {{ $labels.pod }}"
          description: "CPU usage is above 70% (current value: {{ $value | humanizePercentage }})"

      - alert: BackendHighCPUUsage
        expr: 100 * sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="three-tier-app",container="backend"}[5m])) / sum by (pod) (kube_pod_container_resource_limits{namespace="three-tier-app",container="backend",resource="cpu",unit="core"}) > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected on pod {{ $labels.pod }}"
          description: "CPU usage is above 70% (current value: {{ $value | humanizePercentage }})"

      - alert: FrontendHighMemoryUsageWarning
        expr: (sum(container_memory_working_set_bytes{namespace="three-tier-app",container="frontend"}) by (pod) / sum(kube_pod_container_resource_limits{namespace="three-tier-app",container="frontend",resource="memory"}) by (pod)) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected on pod {{ $labels.pod }}"
          description: "Memory usage is above 80% (current value: {{ $value | humanizePercentage }})"

      - alert: BackendHighMemoryUsageWarning
        expr: (sum(container_memory_working_set_bytes{namespace="three-tier-app",container="backend"}) by (pod) / sum(kube_pod_container_resource_limits{namespace="three-tier-app",container="backend",resource="memory"}) by (pod)) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected on pod {{ $labels.pod }}"
          description: "Memory usage is above 80% (current value: {{ $value | humanizePercentage }})"

      - alert: FrontendHighMemoryUsageCritical
        expr: (sum(container_memory_working_set_bytes{namespace="three-tier-app",container="frontend"}) by (pod) / sum(kube_pod_container_resource_limits{namespace="three-tier-app",container="frontend",resource="memory"}) by (pod)) * 100 > 95
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Critical memory usage detected on pod {{ $labels.pod }}"
          description: "Memory usage is above 95% (current value: {{ $value | humanizePercentage }})"
        
      - alert: BackendHighMemoryUsageCritical
        expr: (sum(container_memory_working_set_bytes{namespace="three-tier-app",container="backend"}) by (pod) / sum(kube_pod_container_resource_limits{namespace="three-tier-app",container="backend",resource="memory"}) by (pod)) * 100 > 95
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Critical memory usage detected on pod {{ $labels.pod }}"
          description: "Memory usage is above 95% (current value: {{ $value | humanizePercentage }})"

      - alert: PodNotReady
        expr: kube_pod_status_ready{namespace="three-tier-app", condition="false"} > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "One or more pods are not ready on {{ $labels.pod }}"
          description: "There are pods that are not in a ready state (current value: {{ $value }})"

      - alert: PodFrequentRestarts
        expr: increase(kube_pod_container_status_restarts_total{namespace="three-tier-app"}[10m]) > 3
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "One or more pods are restarting frequently on {{ $labels.pod }}"
          description: "There are pods that are restarting frequently (current value: {{ $value }})"

      - alert: NodeDiskUsageHighWarning
        expr: 100 - (sum(node_filesystem_avail_bytes{fstype=~"ext4|xfs"}) by (instance) / sum(node_filesystem_size_bytes{fstype=~"ext4|xfs"}) by (instance) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage detected on {{ $labels.instance }}"
          description: "Disk usage is above 80% (current value: {{ $value | humanizePercentage }})"

      - alert: NodeDiskUsageHighCritical
        expr: 100 - (sum(node_filesystem_avail_bytes{fstype=~"ext4|xfs"}) by (instance) / sum(node_filesystem_size_bytes{fstype=~"ext4|xfs"}) by (instance) * 100) > 95
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Critical disk usage detected on {{ $labels.instance }}"
          description: "Disk usage is above 95% (current value: {{ $value | humanizePercentage }})"

      - alert: ApplicationMetricsEndpointDown
        expr: up{job=~"frontend|backend"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Application metrics endpoint is down"
          description: "The application metrics endpoint is not responding (current value: {{ $value }})"
